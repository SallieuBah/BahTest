<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b1116}
#stage{position:relative;width:1080px;height:1920px;font-family:Montserrat,sans-serif;color:#e8eef2;
 background:radial-gradient(ellipse at 50% 0%,#16232b 0%,#0b1116 70%)}
.c{position:absolute;left:0;right:0;text-align:center}
#name{top:150px;font-weight:900;font-size:96px;letter-spacing:2px}
#sub1{top:290px;font-weight:500;font-size:34px;letter-spacing:6px;color:#9fb0ba}
#sub2{top:350px;font-weight:500;font-size:42px;color:#d5dde2}
#month{top:440px;font-weight:900;font-size:92px}
#legend{top:560px;font-size:30px;color:#c7d2d8}
#legend i{display:inline-block;width:30px;height:9px;border-radius:5px;margin:0 12px 6px 40px;vertical-align:middle}
svg{position:absolute;left:0;top:0}
.ax{font:500 26px Montserrat;fill:#6f8290}
.card{position:absolute;width:466px;height:150px;border-radius:22px;background:#141e25;border:1.5px solid #1f2c35;box-sizing:border-box;padding:26px 30px}
.card b{display:block;font-weight:700;font-size:28px;letter-spacing:4px;color:#9fb0ba}
.card span{display:block;font-weight:800;font-size:70px;margin-top:6px}
#sharesL{left:50px;top:1690px;position:absolute;font-weight:700;font-size:30px;letter-spacing:4px;color:#9fb0ba}
#sharesV{right:50px;top:1680px;position:absolute;font-weight:800;font-size:44px}
#foot{top:1780px;font-size:24px;color:#5e6f7a}
#handle{top:1830px;font-weight:700;font-size:30px;color:#7d909c}
</style></head><body>
<div id="stage">
 <div class="c" id="name"></div><div class="c" id="sub1"></div><div class="c" id="sub2"></div>
 <div class="c" id="month"></div>
 <div class="c" id="legend"><i style="background:#2ee59d"></i><span id="lv"></span><i style="background:#f2b544"></i><span id="li"></span></div>
 <svg id="svg" width="1080" height="1920"></svg>
 <div class="card" style="left:50px;top:1300px"><b id="k1"></b><span id="v1" style="color:#f2b544"></span></div>
 <div class="card" style="left:564px;top:1300px"><b id="k2"></b><span id="v2" style="color:#2ee59d"></span></div>
 <div class="card" style="left:50px;top:1480px"><b id="k3"></b><span id="v3"></span></div>
 <div class="card" style="left:564px;top:1480px"><b id="k4"></b><span id="v4"></span></div>
 <div id="sharesL"></div><div id="sharesV"></div>
 <div class="c" id="foot"></div><div class="c" id="handle"></div>
</div>
<script>const Q = new URLSearchParams(location.search); document.write('<script src="' + (Q.get("config") || "config.js") + '"><\/script>');</script>
<script>document.write('<script src="' + CONFIG.data + '"><\/script>');</script>
<script>
const C = CONFIG, T = C.text, $ = id => document.getElementById(id);
// Simulate buying C.monthly worth of shares at each month's price.
const rows = PRICES.filter(([m]) => (!C.start || m >= C.start) && (!C.end || m <= C.end));
let shares = 0;
const S = rows.map(([m, p], i) => { shares += C.monthly / p; return { m, inv: C.monthly * (i + 1), val: shares * p, shares }; });
const N = S.length, years = N / 12;
window.DURATION = years * C.secondsPerYear + C.hold;

const num = (v, d = 0) => v.toLocaleString(C.locale, { minimumFractionDigits: d, maximumFractionDigits: d });
const money = v => C.currency + num(Math.round(v));
const monthName = m => new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleString(C.locale, { month: "long", year: "numeric" }).toLocaleUpperCase(C.locale);
const nice = v => { const e = 10 ** Math.floor(Math.log10(v)), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; };
const short = v => v >= 1e6 ? num(v / 1e6, v % 1e6 ? 1 : 0) + "M" : v >= 1e3 ? num(v / 1e3, v % 1e3 ? 1 : 0) + "k" : num(v);

$("name").textContent = C.name;
$("sub1").textContent = C.ticker + "  ·  " + C.exchange;
$("sub2").textContent = T.subtitle.replace("{amount}", C.currency + num(C.monthly));
$("lv").textContent = T.value; $("li").textContent = T.invested;
$("k1").textContent = T.totalInvested; $("k2").textContent = T.portfolio; $("k3").textContent = T.gain; $("k4").textContent = T.ret;
$("sharesL").textContent = T.shares; $("foot").textContent = C.footer; $("handle").textContent = C.handle;

const X0 = 40, X1 = 1000, Y0 = 640, Y1 = 1220; // chart box
window.render = t => {
  const f = Math.min(1, t / (years * C.secondsPerYear)) * (N - 1), k = Math.floor(f), fr = f - k;
  const at = key => k + 1 < N ? S[k][key] + (S[k + 1][key] - S[k][key]) * fr : S[k][key];
  const cur = { inv: at("inv"), val: at("val"), shares: at("shares") };
  // y-axis follows the running max so the line always fits
  const yMax = Math.max(...S.slice(0, k + 2).map(s => Math.max(s.val, s.inv))) * 1.08;
  const x = i => X0 + (X1 - X0) * (f > 0 ? i / f : 0), y = v => Y1 - (Y1 - Y0) * v / yMax;
  const pts = key => { const a = []; for (let i = 0; i <= k; i++) a.push([x(i), y(S[i][key])]); a.push([x(f), y(cur[key])]); return a; };
  const line = p => p.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join("");
  const pv = pts("val"), pi = pts("inv");
  const step = nice(yMax / 3);
  let g = "";
  for (let v = step; v < yMax; v += step) g += `<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" stroke="#1c2a33" stroke-width="2"/><text class="ax" x="${X0}" y="${y(v) - 12}">${C.currency}${short(v)}</text>`;
  // year ticks, thinned to at most ~6 labels
  const every = Math.max(1, Math.ceil((f / 12) / 6));
  for (let i = 0; i <= k; i++) if (S[i].m.endsWith("-01") && (+S[i].m.slice(0, 4)) % every === 0)
    g += `<line x1="${x(i)}" x2="${x(i)}" y1="${Y1}" y2="${Y1 + 12}" stroke="#3a4a55" stroke-width="2"/><text class="ax" x="${x(i)}" y="${Y1 + 50}" text-anchor="middle">${S[i].m.slice(0, 4)}</text>`;
  const end = pv[pv.length - 1], ei = pi[pi.length - 1];
  $("svg").innerHTML = `<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ee59d" stop-opacity=".35"/><stop offset="1" stop-color="#2ee59d" stop-opacity="0"/></linearGradient>
   <filter id="glow"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${g}
   <line x1="${X0}" x2="${X1}" y1="${Y1}" y2="${Y1}" stroke="#2a3944" stroke-width="2"/>
   <path d="${line(pv)}L${end[0]} ${Y1}L${X0} ${Y1}Z" fill="url(#fill)"/>
   <path d="${line(pi)}" fill="none" stroke="#f2b544" stroke-width="5" stroke-linejoin="round"/>
   <path d="${line(pv)}" fill="none" stroke="#2ee59d" stroke-width="7" stroke-linejoin="round" filter="url(#glow)"/>
   <circle cx="${ei[0]}" cy="${ei[1]}" r="10" fill="#f2b544"/>
   <circle cx="${end[0]}" cy="${end[1]}" r="20" fill="#2ee59d" opacity=".3"/><circle cx="${end[0]}" cy="${end[1]}" r="11" fill="#2ee59d" stroke="#d8fff0" stroke-width="4"/>`;
  const gain = cur.val - cur.inv, ret = gain / cur.inv * 100, up = gain >= 0;
  $("month").textContent = monthName(S[Math.round(f)].m);
  $("v1").textContent = money(cur.inv); $("v2").textContent = money(cur.val);
  $("v3").textContent = (up ? "+" : "−") + money(Math.abs(gain)); $("v3").style.color = up ? "#2ee59d" : "#ff5c6c";
  $("v4").textContent = (up ? "+" : "−") + num(Math.abs(ret), 1) + "%"; $("v4").style.color = up ? "#2ee59d" : "#ff5c6c";
  $("sharesV").textContent = num(cur.shares, 0) + " " + T.sharesUnit;
};
if (!window.RENDER_MODE) { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
</script></body></html>
